profile:
  name: devauc

unit_convention: legacy_fixed_kpc

model:
  name: sonnenfeld2024_slacs

data:
  inference_dataset_path: /Users/liurongfu/Work/CMASS_lens_project/data/external/inference_dataset_sonnenfeld2024_slacs_m5_fixed_v1.hdf5

fp_prior:
  enabled: true

box_prior:
  mu5_0: [10.5, 12.2]
  beta5: [-3.0, 3.0]
  xi5: [-3.0, 3.0]
  sigma5: [1.0e-2, 0.3]
  mu_gamma_0: [1.2, 2.8]
  beta_gamma: [-3.0, 3.0]
  xi_gamma: [-3.0, 3.0]
  sigma_gamma: [1.0e-2, 0.8]
  mu_zs: [0.0, 2.0]
  sigma_zs: [1.0e-3, 1.0]
  theta0: [0.0, 3.0]
  loga: [-1.0, 3.0]

sampling:
  n_walkers: 24
  n_steps: 10000
  burn_in: 2000
  random_seed: 7
  initial_jitter_scale: 1.0e-3
  initial_center:
    mu5_0: 11.332
    beta5: 0.59
    xi5: -0.11
    sigma5: 0.064
    mu_gamma_0: 1.99
    beta_gamma: 0.03
    xi_gamma: -0.67
    sigma_gamma: 0.149
    mu_zs: 0.48
    sigma_zs: 0.215
    theta0: 0.93
    loga: 1.0

integration:
  gamma_points: 200
  mstar_points: 200
  normalization_samples: 100000

cosmology:
  h0: 70.0
  omega_m: 0.3

runtime:
  checkpoint_every: 100
  parallel_strategy: auto
  progress: true
  progress_summary_every: 25
  show_stage_timing: true
  disable_hdf5_file_locking: false
  num_threads: 0
  reserve_cores: 2

output:
  root_dir: /Users/liurongfu/Work/CMASS_lens_project/outputs
  run_label: sonnenfeld2024-slacs
  overwrite_latest: true
