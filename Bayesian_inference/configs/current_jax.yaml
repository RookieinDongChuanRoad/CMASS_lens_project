profile:
  name: sersic

model:
  name: cmass_current

mass_definition:
  enclosed_radius_kpc: 5

gamma_model:
  mode: dependent

data:
  observation_path: /Users/liurongfu/Work/CMASS_lens_project/data/raw/observations_with_mass_grids_all.hdf5
  cross_section_path: /Users/liurongfu/Work/CMASS_lens_project/data/external/cs_grid_power.h5

box_prior:
  mu5_0: [9.0, 12.0]
  beta5: [-3.0, 3.0]
  xi5: [-3.0, 3.0]
  sigma5: [1.0e-2, 0.2]
  mu_gamma_0: [1.5, 2.5]
  beta_gamma: [-3.0, 3.0]
  xi_gamma: [-3.0, 3.0]
  sigma_gamma: [0.0, 0.5]
  mu_zs: [1.0, 3.0]
  sigma_zs: [0.0, 2.0]
  theta0: [0.0, 3.0]
  loga: [-1.0, 3.0]

sampling:
  n_walkers: 24
  n_steps: 10000
  warmup: 2000
  num_chains: 1
  num_samples: 10000
  num_warmup: 2000
  thinning: 1
  chain_method: sequential
  random_seed: 7
  initial_jitter_scale: 1.0e-3
  initial_center:
    mu5_0: 11.32
    beta5: 0.59
    xi5: -0.11
    sigma5: 0.06
    mu_gamma_0: 1.99
    beta_gamma: 0.10
    xi_gamma: -0.67
    sigma_gamma: 0.149
    mu_zs: 1.8
    sigma_zs: 0.215
    theta0: 0.93
    loga: 1.0

integration:
  gamma_points: 200
  mstar_points: 200
  normalization_samples: 100000

cosmology:
  h0: 70.0
  omega_m: 0.3

runtime:
  checkpoint_every: 100
  parallel_strategy: auto
  progress: true
  progress_summary_every: 25
  show_stage_timing: true
  disable_hdf5_file_locking: false
  num_threads: 0
  reserve_cores: 2

output:
  root_dir: /Users/liurongfu/Work/CMASS_lens_project/outputs
  run_label: current-jax
  overwrite_latest: true
