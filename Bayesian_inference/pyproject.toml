[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmass-lens-inference"
version = "0.1.0"
description = "Hierarchical Bayesian inference framework for CMASS strong-lens population studies."
readme = "PROJECT_REQUIREMENTS.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=7.2",
  "arviz>=0.22",
  "corner>=2.2",
  "h5py>=3.10",
  "jax>=0.8.3,<0.9",
  "jaxlib>=0.8.3,<0.9",
  "numpyro>=0.20.1,<0.21",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
legacy = [
  "emcee>=3.1",
]

[project.scripts]
cmass-lens-inference = "cmass_lens_inference.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
