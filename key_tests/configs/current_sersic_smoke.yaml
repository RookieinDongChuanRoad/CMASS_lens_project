profile:
  name: sersic
mass_definition:
  enclosed_radius_kpc: 5
gamma_model:
  mode: dependent
data:
  observation_path: /Users/liurongfu/Work/CMASS_lens_project/data/raw/observations_with_m5_grids_all.hdf5
  cross_section_path: /Users/liurongfu/Work/CMASS_lens_project/data/external/cs_grid_power.h5
box_prior:
  mu5_0: [9.0, 12.0]
  beta5: [-3.0, 3.0]
  xi5: [-3.0, 3.0]
  sigma5: [1.0e-2, 0.2]
  mu_gamma_0: [1.5, 2.5]
  beta_gamma: [-3.0, 3.0]
  xi_gamma: [-3.0, 3.0]
  sigma_gamma: [0.0, 0.5]
