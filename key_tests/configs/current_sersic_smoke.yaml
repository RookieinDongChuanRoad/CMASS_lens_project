  sigma_zs: [0.0, 2.0]
  theta0: [0.0, 3.0]
  loga: [-1.0, 3.0]
sampling:
  n_walkers: 24
  n_steps: 4
  warmup: 0
  random_seed: 7
  initial_center:
    mu5_0: 11.32
    beta5: 0.59
    xi5: -0.11
    sigma5: 0.06
    mu_gamma_0: 1.99
    beta_gamma: 0.1
    xi_gamma: -0.67
    sigma_gamma: 0.149
    mu_zs: 1.8
    sigma_zs: 0.215
