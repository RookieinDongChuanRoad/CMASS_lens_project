[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-sl"
version = "0.1.0"
description = "Public package facade for statistical strong-lensing workflows."
requires-python = ">=3.11"
dependencies = [
  "arviz>=0.22",
  "astropy>=7.2",
  "corner>=2.2",
  "emcee>=3.1",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numba>=0.64",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
statistical-sl = "statistical_sl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "real_data: tests that require locally synced data products",
  "slow: tests that run heavier numerical checks than synthetic unit tests",
]
